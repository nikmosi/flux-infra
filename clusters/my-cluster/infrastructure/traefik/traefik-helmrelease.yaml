---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 3
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "41.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h
  targetNamespace: traefik
  values:
    deployment:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              topologyKey: kubernetes.io/hostname

    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    env:
      - name: TZ
        value: Asia/Novosibirsk

    ports:
      web:
        port: 8000
        expose:
          default: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 10m
            writeTimeout: 10m
      forgejo-ssh:
        port: 8022
        expose:
          default: true
        exposedPort: 22
        protocol: TCP
      mail-smtp:
        port: 25
        expose:
          default: true
        exposedPort: 25
        protocol: TCP
      mail-smtps:
        port: 465
        expose:
          default: true
        exposedPort: 465
        protocol: TCP
      mail-submission:
        port: 587
        expose:
          default: true
        exposedPort: 587
        protocol: TCP
      mail-imap:
        port: 143
        expose:
          default: true
        exposedPort: 143
        protocol: TCP
      mail-imaps:
        port: 993
        expose:
          default: true
        exposedPort: 993
        protocol: TCP
      mail-pop3:
        port: 110
        expose:
          default: true
        exposedPort: 110
        protocol: TCP
      mail-pop3s:
        port: 995
        expose:
          default: true
        exposedPort: 995
        protocol: TCP
      mail-sieve:
        port: 4190
        expose:
          default: true
        exposedPort: 4190
        protocol: TCP
