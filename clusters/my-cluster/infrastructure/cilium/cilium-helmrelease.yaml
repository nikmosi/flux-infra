---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    k8sServiceHost: "192.168.3.6"
    k8sServicePort: 6443
    kubeProxyReplacement: true
    cni:
      binPath: "/var/lib/rancher/k3s/data/cni"
      confPath: "/var/lib/rancher/k3s/agent/etc/cni/net.d"
    cgroup:
      autoMount:
        enabled: false
      hostRoot: "/sys/fs/cgroup"
    ipam:
      mode: "kubernetes"
    routingMode: "native"
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    autoDirectNodeRoutes: true
    bpf:
      masquerade: true
    enableIPv4Masquerade: true
    bgpControlPlane:
      enabled: true
    operator:
      replicas: 1
