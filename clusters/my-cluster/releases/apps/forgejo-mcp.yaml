apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: forgejo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-mcp
    spec:
      imagePullSecrets:
        - name: zot-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo-mcp
          image: zot.xinfra.ru/forgejo-mcp:v0.1.1 # {"$imagepolicy": "flux-system:forgejo-mcp"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: AUTHELIA_URL
              value: "https://auth.xinfra.ru"
            - name: RESOURCE_URL
              value: "https://mcp-forgejo.xinfra.ru/mcp"
            - name: TARGET_URL
              value: "http://forgejo-http.developer-tools.svc.cluster.local:3000"
            - name: TARGET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-mcp-secrets
                  key: TARGET_TOKEN
            - name: STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-mcp-secrets
                  key: STATIC_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: forgejo-mcp
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: forgejo-mcp
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: forgejo-mcp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mcp-forgejo.xinfra.ru`)
      kind: Rule
      services:
        - name: forgejo-mcp
          port: 8000
  tls:
    secretName: wildcard-xinfra-ru-tls
