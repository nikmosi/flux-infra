---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: forgejo-mcp
  annotations:
    kube-score/ignore: "pod-networkpolicy,container-security-context-readonlyrootfilesystem"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-mcp
      annotations:
        kube-score/ignore: "pod-networkpolicy,container-security-context-readonlyrootfilesystem"
    spec:
      imagePullSecrets:
        - name: zot-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo-mcp
          image: zot.xinfra.ru/forgejo-mcp:0.1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FORGEJO_URL
              value: "http://forgejo-http.developer-tools.svc.cluster.local:3000"
            - name: FORGEJO_TOKEN
              value: "cdaf188aaa601dad75da990f3cab45b6571743a7"
            - name: AUTHELIA_URL
              value: "https://auth.xinfra.ru"
            - name: RESOURCE_URL
              value: "https://mcp-forgejo.xinfra.ru/mcp"
            - name: CLIENT_ID
              value: "gemini-spark"
            - name: CLIENT_SECRET
              value: "nD_0MiaH4enUKNE0E4dQ4U2bj1HXYObYvwbucZeqn-I"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-mcp
  namespace: apps
  labels:
    app.kubernetes.io/name: forgejo-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forgejo-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-mcp
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mcp-forgejo.xinfra.ru`)
      kind: Rule
      services:
        - name: forgejo-mcp
          port: 8000
  tls:
    secretName: wildcard-xinfra-ru-tls
