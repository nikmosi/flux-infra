---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-custom-templates
  namespace: developer-tools
data:
  home.tmpl: |
    {{template "base/head" .}}
    <style>
      .shadcn-hero {
        position: relative;
        padding: 6rem 1.5rem 4.5rem;
        text-align: center;
        background: radial-gradient(ellipse at top, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        border-bottom: 1px solid var(--color-border, rgba(255, 255, 255, 0.1));
      }
      .shadcn-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid var(--color-border, rgba(255, 255, 255, 0.15));
        background: var(--color-box-header, rgba(30, 41, 59, 0.5));
        color: var(--color-text, #f8fafc);
        backdrop-filter: blur(8px);
        margin-bottom: 1.5rem;
      }
      .shadcn-title {
        font-size: 3rem;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.025em;
        color: var(--color-text, #f8fafc);
        max-width: 800px;
        margin: 0 auto 1.25rem;
      }
      .shadcn-title-gradient {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .shadcn-subtitle {
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--color-text-secondary, #94a3b8);
        max-width: 640px;
        margin: 0 auto 2.5rem;
      }
      .shadcn-btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: var(--color-primary, #6366f1);
        color: #ffffff !important;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none !important;
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      .shadcn-btn-primary:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }
      .shadcn-btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: transparent;
        color: var(--color-text, #f8fafc) !important;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        border: 1px solid var(--color-border, rgba(255, 255, 255, 0.15));
        text-decoration: none !important;
        transition: all 0.2s ease;
      }
      .shadcn-btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.05);
        transform: translateY(-1px);
      }
      .shadcn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        max-width: 1100px;
        margin: 4rem auto;
        padding: 0 1.5rem;
      }
      .shadcn-card {
        background: var(--color-box-body, rgba(15, 23, 42, 0.6));
        border: 1px solid var(--color-border, rgba(255, 255, 255, 0.1));
        border-radius: 0.75rem;
        padding: 1.75rem;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .shadcn-card:hover {
        border-color: rgba(99, 102, 241, 0.4);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }
      .shadcn-card-icon {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.5rem;
        background: rgba(99, 102, 241, 0.1);
        color: #818cf8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
      }
      .shadcn-card-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--color-text, #f8fafc);
        margin: 0;
      }
      .shadcn-card-desc {
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--color-text-secondary, #94a3b8);
        margin: 0;
      }
    </style>

    <div role="main" aria-label="{{ctx.Locale.Tr "home"}}" class="page-content home">
        <div class="shadcn-hero">
            <div class="shadcn-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <span>Self-Hosted Enterprise Git Platform</span>
            </div>

            <h1 class="shadcn-title">
                Приватный Git-сервер для вашей разработки на <span class="shadcn-title-gradient">Forgejo</span>
            </h1>

            <p class="shadcn-subtitle">
                Полный контроль над исходным кодом, встроенный CI/CD, высокая производительность и быстрая интеграция в Kubernetes-кластер.
            </p>

            <div style="display: flex; gap: 1rem; justify-content: center; align-items: center; flex-wrap: wrap;">
                {{if .IsSigned}}
                    <a class="shadcn-btn-primary" href="{{AppSubUrl}}/dashboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        Перейти к репозиториям
                    </a>
                    <a class="shadcn-btn-secondary" href="{{AppSubUrl}}/explore/repos">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        Обзор проектов
                    </a>
                {{else}}
                    <a class="shadcn-btn-primary" href="{{AppSubUrl}}/user/login">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        Войти в систему
                    </a>
                    {{if .AllowRegistration}}
                        <a class="shadcn-btn-secondary" href="{{AppSubUrl}}/user/sign_up">
                            Создать аккаунт
                        </a>
                    {{end}}
                {{end}}
            </div>
        </div>

        <div class="shadcn-grid">
            <div class="shadcn-card">
                <div class="shadcn-card-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h3 class="shadcn-card-title">Безопасность & SSO</h3>
                <p class="shadcn-card-desc">Единый вход через Authelia OIDC и LLDAP. Безопасное управление правами доступа и ключами SSH.</p>
            </div>

            <div class="shadcn-card">
                <div class="shadcn-card-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </div>
                <h3 class="shadcn-card-title">Высокая скорость</h3>
                <p class="shadcn-card-desc">Оптимизировано для Kubernetes-кластера с томами Longhorn RWX и кэшированием Valkey.</p>
            </div>

            <div class="shadcn-card">
                <div class="shadcn-card-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
                <h3 class="shadcn-card-title">GitOps Readiness</h3>
                <p class="shadcn-card-desc">Автоматическая синхронизация конфигурации и манифестов через Flux CD.</p>
            </div>
        </div>
    </div>
    {{template "base/footer" .}}
