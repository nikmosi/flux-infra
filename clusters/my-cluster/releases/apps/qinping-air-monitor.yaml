apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qinping-air-monitor
  namespace: apps
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: qinping-air-monitor
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: zot.xinfra.ru/qinping-air-monitor
      tag: "v0.1.0"  # {"$imagepolicy": "flux-system:qinping-air-monitor:tag"}
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: zot-reader
    existingSecret: qinping-air-monitor
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
