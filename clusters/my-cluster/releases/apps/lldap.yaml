---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: apps-lldap
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s/apps/lldap
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  values:
    lldap:
      image:
        pullPolicy: Always
    image:
      pullPolicy: Always
    extraEnv:
      - name: TZ
        value: Asia/Novosibirsk
    ingress:
      annotations:
        traefik.ingress.kubernetes.io/router.tls.options: traefik-mtls-strict@kubernetescrd
