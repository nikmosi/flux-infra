---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: apps-goldilocks
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s/charts/goldilocks
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: goldilocks-controller
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  exec:
                    command:
                      - /goldilocks
                      - --help
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  exec:
                    command:
                      - /goldilocks
                      - --help
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
  values:
    image:
      repository: us-docker.pkg.dev/fairwinds-ops/oss/goldilocks
      tag: v4.14.1
      pullPolicy: Always

    controller:
      extraEnv:
        - name: TZ
          value: Asia/Novosibirsk
      resources:
        requests:
          cpu: 15m
          memory: 100Mi
        limits:
          memory: 192Mi

    dashboard:
      enabled: true
      replicaCount: 2
      extraEnv:
        - name: TZ
          value: Asia/Novosibirsk
      resources:
        requests:
          cpu: 15m
          memory: 100Mi
        limits:
          memory: 192Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: apps-goldilocks-forwardauth-authelia@kubernetescrd
          traefik.ingress.kubernetes.io/router.tls.options: traefik-mtls-strict@kubernetescrd
        hosts:
          - host: goldilocks.xinfra.ru
            paths:
              - path: /
                type: Prefix
        tls:
          - hosts:
              - goldilocks.xinfra.ru
            secretName: wildcard-xinfra-ru-tls
      excludeContainers: linkerd-proxy,istio-proxy

    vpa:
      enabled: true
      updater:
        enabled: false
      admissionController:
        resources:
          limits:
            cpu: 200m
            memory: 500Mi
      recommender:
        resources:
          limits:
            cpu: 200m
            memory: 1000Mi
