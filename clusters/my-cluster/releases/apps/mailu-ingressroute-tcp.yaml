---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mailu-smtp
  namespace: apps-mailu
spec:
  entryPoints: [mail-smtp]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: mailu-front
          port: 25
