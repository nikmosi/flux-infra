---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: apps-pgadmin
spec:
  dependsOn:
    - name: authelia
      namespace: apps-authelia
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: pgadmin4
      sourceRef:
        kind: HelmRepository
        name: runix
        namespace: flux-system
      interval: 1h
  values:
    env:
      email: nikmosi@xinfra.ru
    existingSecret: pgadmin-default-password
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    persistentVolume:
      size: 5Gi
      storageClass: longhorn
    ingress:
      enabled: true
      ingressClassName: "traefik"
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: apps-pgadmin-forwardauth-authelia@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls.options: traefik-mtls-strict@kubernetescrd
      hosts:
        - host: pgadmin.xinfra.ru
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: wildcard-xinfra-ru-tls
          hosts:
            - pgadmin.xinfra.ru
