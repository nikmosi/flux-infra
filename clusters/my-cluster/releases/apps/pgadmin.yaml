---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: database
spec:
  dependsOn:
    - name: authelia
      namespace: security
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: pgadmin4
      sourceRef:
        kind: HelmRepository
        name: runix
        namespace: flux-system
      interval: 1h
  values:
    strategy:
      type: Recreate
    env:
      email: nikmosi@xinfra.ru
    envVarsExtra:
      - name: TMPDIR
        value: /var/lib/pgadmin
    existingSecret: pgadmin-default-password
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    startupProbe:
      initialDelaySeconds: 10
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 30
    persistentVolume:
      size: 5Gi
      storageClass: longhorn
    ingress:
      enabled: true
      ingressClassName: "traefik"
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: security-forwardauth-authelia@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls.options: networking-mtls-strict@kubernetescrd
      hosts:
        - host: pgadmin.xinfra.ru
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: wildcard-xinfra-ru-tls
          hosts:
            - pgadmin.xinfra.ru
