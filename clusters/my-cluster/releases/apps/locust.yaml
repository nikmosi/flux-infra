---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: locust
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s/apps/locust
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  releaseName: traffic-noise
  targetNamespace: apps-noise
