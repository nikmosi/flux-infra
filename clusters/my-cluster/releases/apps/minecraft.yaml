---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-low
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    kube-score/ignore: "pod-networkpolicy,container-security-context-readonlyrootfilesystem,container-image-tag,container-ephemeral-storage-request-and-limit,container-security-context-user-group-id,statefulset-has-servicename,pod-probes-identical"
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
      annotations:
        kube-score/ignore: "pod-networkpolicy,container-security-context-readonlyrootfilesystem,container-image-tag,container-ephemeral-storage-request-and-limit,container-security-context-user-group-id,statefulset-has-servicename,pod-probes-identical"
    spec:
      nodeSelector:
        kubernetes.io/hostname: acemagic
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java17
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "FORGE"
            - name: VERSION
              value: "1.20.1"
            - name: FORGE_VERSION
              value: "47.4.26"
            - name: MEMORY
              value: "10G"
            - name: JVM_XX_OPTS
              value: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC"
            - name: MOTD
              value: "Modded Minecraft 1.20.1 Server"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PORT
              value: "25575"
          resources:
            requests:
              cpu: 2000m
              memory: 8Gi
            limits:
              cpu: 6000m
              memory: 12Gi
          startupProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
        - name: mc-monitor
          image: itzg/mc-monitor:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          args:
            - export-for-prometheus
            - -servers
            - 127.0.0.1:25565
            - -port
            - "8080"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: minecraft
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
