---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-low
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    kube-score/ignore: "pod-networkpolicy,container-security-context-readonlyrootfilesystem,container-image-tag,container-ephemeral-storage-request-and-limit,container-security-context-user-group-id,statefulset-has-servicename,pod-probes-identical,container-image-pull-policy"
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
      annotations:
        kube-score/ignore: "pod-networkpolicy,container-security-context-readonlyrootfilesystem,container-image-tag,container-ephemeral-storage-request-and-limit,container-security-context-user-group-id,statefulset-has-servicename,pod-probes-identical,container-image-pull-policy"
    spec:
      terminationGracePeriodSeconds: 180
      nodeSelector:
        kubernetes.io/hostname: acemagic
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java17@sha256:6eeaf2dc61addb28a6a6568e9c4144dfb977297fcae398cde230802c2da64cd3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: mc-metrics
              containerPort: 19565
              protocol: TCP
            - name: voicechat
              containerPort: 24454
              protocol: UDP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "FORGE"
            - name: VERSION
              value: "1.20.1"
            - name: FORGE_VERSION
              value: "47.4.0"
            - name: MEMORY
              value: "10G"
            - name: USE_AIKAR_FLAGS
              value: "TRUE"
            - name: MOTD
              value: "All the Mods 9 - No Frills"
            - name: ALLOW_FLIGHT
              value: "TRUE"
            - name: MAX_TICK_TIME
              value: "180000"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: SIMULATION_DISTANCE
              value: "5"
            - name: VIEW_DISTANCE
              value: "10"
            - name: SYNC_CHUNK_WRITES
              value: "false"
            - name: RCON_CMDS_STARTUP
              value: |-
                gamerule playersSleepingPercentage 33
          resources:
            requests:
              cpu: 2000m
              memory: 12Gi
            limits:
              cpu: 6000m
              memory: 16Gi
          startupProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
        - name: mc-monitor
          image: itzg/mc-monitor:latest@sha256:f5e15a04fb29ee6befd768fcdf9009e9c642197430edfed371415276e9ee1c1f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          args:
            - export-for-prometheus
            - -servers
            - 127.0.0.1:25565
            - -port
            - "8080"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    lbipam.cilium.io/ips: "10.10.0.2"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: voicechat
      port: 24454
      targetPort: 24454
      protocol: UDP
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: minecraft
  namespace: apps
  labels:
    app.kubernetes.io/name: minecraft
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
    - port: mc-metrics
      interval: 15s
      scrapeTimeout: 10s
