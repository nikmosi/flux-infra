---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgesync
  namespace: forgesync
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s/apps/forgesync
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  releaseName: forgesync
  targetNamespace: forgesync
  values:
    imagePullSecrets:
      - name: zot
    image:
      pullPolicy: Always
    source: "https://git.xinfra.ru"
    env:
      - name: TZ
        value: Asia/Novosibirsk
    targets:
      codeberg:
        target: "codeberg"
        existingSecret: "targets-creds"
