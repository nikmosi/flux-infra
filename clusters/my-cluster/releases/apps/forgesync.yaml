---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgesync
  namespace: forgesync
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s/apps/forgesync
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  releaseName: forgesync
  targetNamespace: forgesync
  values:
    imagePullSecrets:
      - name: zot
    image:
      pullPolicy: Always
    source: "https://git.xinfra.ru/api/v1"
    env:
      - name: TZ
        value: Asia/Novosibirsk
    targets:
      github:
        enabled: false
      codeberg:
        enabled: true
        target: "codeberg"
        env:
          - name: SOURCE_TOKEN
            valueFrom:
              secretKeyRef:
                name: targets-creds
                key: FORGEJO_TOKEN
          - name: TARGET_TOKEN
            valueFrom:
              secretKeyRef:
                name: targets-creds
                key: CODEBERG_TOKEN
          - name: MIRROR_TOKEN
            valueFrom:
              secretKeyRef:
                name: targets-creds
                key: CODEBERG_TOKEN
