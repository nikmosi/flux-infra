---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vps-nodes-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  vps-nodes-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "VPS Status",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "OFFLINE"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "ONLINE"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 0
          },
          "id": 2,
          "title": "3x-ui Service",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "DOWN"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "ACTIVE"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_systemd_unit_state{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", name=\"x-ui.service\", state=\"active\"}",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 0
          },
          "id": 3,
          "title": "Uptime",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - node_boot_time_seconds{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 0
          },
          "id": 4,
          "title": "CPU Usage",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", mode=\"idle\"}[5m])) * 100)",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 5,
          "title": "RAM Usage",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((node_memory_MemTotal_bytes{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"} - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 6,
          "title": "Root Disk Usage",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - (node_filesystem_avail_bytes{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 7,
          "title": "Active Conntrack",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_nf_conntrack_entries{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 8,
          "title": "VPN & Network Traffic",
          "type": "row"
        },
        {
          "gridPos": {
            "h": 8,
            "w": 14,
            "x": 0,
            "y": 5
          },
          "id": 9,
          "title": "Network Bandwidth ($interface)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Receive (Ingress)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#56A64B",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Transmit (Egress)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#3274D9",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_receive_bytes_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[1m]) * 8",
              "legendFormat": "Receive (Ingress)",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_transmit_bytes_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[1m]) * 8",
              "legendFormat": "Transmit (Egress)",
              "refId": "B"
            }
          ]
        },
        {
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 14,
            "y": 5
          },
          "id": 10,
          "title": "Traffic Volume ($__range)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "increase(node_network_receive_bytes_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[$__range])",
              "legendFormat": "Ingress Volume",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "increase(node_network_transmit_bytes_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[$__range])",
              "legendFormat": "Egress Volume",
              "refId": "B"
            }
          ]
        },
        {
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "id": 11,
          "title": "Network Drops & Errors ($interface)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_receive_drop_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[1m])",
              "legendFormat": "RX Drops",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_transmit_drop_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[1m])",
              "legendFormat": "TX Drops",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_receive_errs_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[1m])",
              "legendFormat": "RX Errors",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_transmit_errs_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\", device=~\"$interface\"}[1m])",
              "legendFormat": "TX Errors",
              "refId": "D"
            }
          ]
        },
        {
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "id": 12,
          "title": "Host Internals & System Resources",
          "type": "row"
        },
        {
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "id": 13,
          "title": "CPU Breakdown by Mode",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "fillOpacity": 40,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}[5m]))",
              "legendFormat": "{{mode}}",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "id": 14,
          "title": "Memory Breakdown",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 30,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_memory_MemTotal_bytes{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"} - node_memory_MemAvailable_bytes",
              "legendFormat": "Used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_memory_Buffers_bytes{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "legendFormat": "Buffers",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_memory_Cached_bytes{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "legendFormat": "Cached",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_memory_MemFree_bytes{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "legendFormat": "Free",
              "refId": "D"
            }
          ]
        },
        {
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "id": 15,
          "title": "Disk I/O Rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_disk_read_bytes_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}[1m])",
              "legendFormat": "Read",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_disk_written_bytes_total{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}[1m])",
              "legendFormat": "Write",
              "refId": "B"
            }
          ]
        },
        {
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 16,
          "title": "Connection Stack & Security",
          "type": "row"
        },
        {
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "id": 17,
          "title": "TCP Sockets State",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_sockstat_TCP_alloc{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "legendFormat": "Allocated",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_sockstat_TCP_inuse{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "legendFormat": "In Use",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_sockstat_TCP_tw{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}",
              "legendFormat": "Time Wait",
              "refId": "C"
            }
          ]
        },
        {
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "id": 18,
          "title": "Conntrack Table Saturation",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(node_nf_conntrack_entries{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"} / node_nf_conntrack_entries_limit{job=\"prometheus.scrape.node_exporter\", instance=~\"$instance\"}) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {
            "h": 1,
            "w": 24,
