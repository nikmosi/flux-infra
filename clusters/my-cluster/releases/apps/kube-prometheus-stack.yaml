---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: flux-system
      interval: 1h
  releaseName: kube-prometheus-stack
  targetNamespace: apps-kube-prometheus-stack
  values:
    fullnameOverride: kube-prometheus-stack

    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true

    defaultRules:
      create: true
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false

    alertmanager:
      enabled: true
      ingress:
        enabled: false
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
          - target_matchers:
              - alertname = InfoInhibitor
        route:
          group_by:
            - namespace
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: ntfy
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
            - matchers:
                - alertname = "InfoInhibitor"
              receiver: "null"
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              - url: http://alertmanager-ntfy-adapter.apps-kube-prometheus-stack.svc.cluster.local:8080/alertmanager
                send_resolved: true
        templates:
          - /etc/alertmanager/config/*.tmpl
      alertmanagerSpec:
        replicas: 1
        retention: 120h
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    grafana:
      enabled: true
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Asia/Novosibirsk

      adminUser: admin
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: grafana-authelia-oauth
            key: client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-authelia-oauth
            key: client-secret

      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.xinfra.ru
        path: /
        tls:
          - hosts:
              - grafana.xinfra.ru
            secretName: wildcard-xinfra-ru-tls

      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 5Gi

      initChownData:
        enabled: false

      grafana.ini:
        server:
          domain: grafana.xinfra.ru
          root_url: https://grafana.xinfra.ru
        auth:
          signout_redirect_url: https://auth.xinfra.ru/logout
        analytics:
          reporting_enabled: false
          check_for_updates: false
        security:
          disable_gravatar: true
        users:
          allow_sign_up: false
          auto_assign_org_role: Viewer
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authelia
          client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid profile email entitlements offline_access
          auth_url: https://auth.xinfra.ru/api/oidc/authorization
          token_url: https://auth.xinfra.ru/api/oidc/token
          api_url: https://auth.xinfra.ru/api/oidc/userinfo
          use_pkce: true
          use_refresh_token: true
          allow_sign_up: true
          allow_assign_grafana_admin: true
          login_attribute_path: preferred_username
          name_attribute_path: name
          email_attribute_path: email
          role_attribute_path: >-
            contains(entitlements, 'Grafana Admins') && 'Admin' ||
            contains(entitlements, 'Grafana Editors') && 'Editor' || 'Viewer'

      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
          isDefaultDatasource: true
          uid: prometheus
          alertmanager:
            enabled: true
            uid: alertmanager
            handleGrafanaManagedAlerts: false
            implementation: prometheus

      resources:
        requests:
          cpu: 50m
          memory: 448Mi
        limits:
          memory: 768Mi

    kubeApiServer:
      enabled: true

    kubelet:
      enabled: true
      serviceMonitor:
        cAdvisor: true

    kubeControllerManager:
      enabled: false

    coreDns:
      enabled: true

    kubeDns:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    kubeStateMetrics:
      enabled: true

    kube-state-metrics:
      releaseLabel: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      releaseLabel: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

    prometheusOperator:
      enabled: true
      admissionWebhooks:
        enabled: true
        patch:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    prometheus:
      enabled: true
      ingress:
        enabled: false
      prometheusSpec:
        replicas: 1
        shards: 1
        scrapeInterval: 60s
        scrapeTimeout: 10s
        evaluationInterval: 60s
        # Retention is capped by both time and disk usage; whichever is hit first wins.
        retention: 90d
        retentionSize: 16GiB
        walCompression: true

        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}

        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}

        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}

        probeSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeNamespaceSelector: {}

        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeConfigSelector: {}
        scrapeConfigNamespaceSelector: {}

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

    thanosRuler:
      enabled: false

    extraManifests:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: alertmanager-ntfy-adapter
          namespace: apps-kube-prometheus-stack
          labels:
            app.kubernetes.io/name: alertmanager-ntfy-adapter
            app.kubernetes.io/part-of: kube-prometheus-stack
        data:
          adapter.py: |
            import json
            import os
            import urllib.error
            import urllib.parse
            import urllib.request
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


            NTFY_URL = os.environ.get("NTFY_URL", "http://ntfy.apps-ntfy.svc.cluster.local/")
            NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "grafana")
            TOKEN_FILE = os.environ.get("NTFY_TOKEN_FILE", "/etc/ntfy-token/token")
            GRAFANA_URL = os.environ.get("GRAFANA_URL", "https://grafana.xinfra.ru").rstrip("/")
            GRAFANA_DATASOURCE_UID = os.environ.get("GRAFANA_DATASOURCE_UID", "prometheus")
            GRAFANA_ORG_ID = os.environ.get("GRAFANA_ORG_ID", "1")
            GRAFANA_RANGE_FROM = os.environ.get("GRAFANA_RANGE_FROM", "now-1h")
            GRAFANA_RANGE_TO = os.environ.get("GRAFANA_RANGE_TO", "now")


            def read_token():
                with open(TOKEN_FILE, "r", encoding="utf-8") as token_file:
                    return token_file.read().strip()


            def label(alert, name, default=""):
                return alert.get("labels", {}).get(name, default)


            def annotation(alert, name, default=""):
                return alert.get("annotations", {}).get(name, default)


            def alert_name(alert):
                return label(alert, "alertname", "Alert")


            def alert_subject(alert):
                namespace = label(alert, "namespace")
                pod = label(alert, "pod")
                container = label(alert, "container")
                if namespace and pod and container:
                    return f"{namespace}/{pod} ({container})"
                if namespace and pod:
                    return f"{namespace}/{pod}"
                return label(alert, "instance", "")


            def priority(status, alerts):
                if status == "resolved":
                    return 2
                severities = {label(alert, "severity") for alert in alerts}
                if "critical" in severities:
                    return 5
                if "warning" in severities:
                    return 4
                return 3


            def tags(status, alerts):
                severities = sorted({label(alert, "severity") for alert in alerts if label(alert, "severity")})
                base = ["white_check_mark"] if status == "resolved" else ["rotating_light"]
                return ["prometheus", "alertmanager"] + severities + base


            def title(status, alerts):
                first = alerts[0] if alerts else {}
                suffix = alert_subject(first)
                status_text = status.upper()
                count = len(alerts)
                text = f"[{status_text}:{count}] {alert_name(first)}"
                return f"{text} {suffix}" if suffix else text


            def message(alerts):
                parts = []
                for alert in alerts:
                    lines = []
                    summary = annotation(alert, "summary")
                    description = annotation(alert, "description")
                    if summary:
                        lines.append(summary)
                    subject = alert_subject(alert)
                    if subject:
                        lines.append(f"Target: {subject}")
                    severity = label(alert, "severity")
                    if severity:
                        lines.append(f"Severity: {severity}")
                    reason = label(alert, "reason")
                    if reason:
                        lines.append(f"Reason: {reason}")
                    if description and description not in lines:
                        lines.append(description)
                    runbook = annotation(alert, "runbook_url")
                    if runbook:
                        lines.append(f"Runbook: {runbook}")
                    parts.append("\n".join(lines) or alert_name(alert))
                return "\n\n---\n\n".join(parts)


            def prometheus_expr(generator_url):
                if not generator_url:
                    return ""
                query = urllib.parse.parse_qs(urllib.parse.urlparse(generator_url).query)
                values = query.get("g0.expr") or query.get("query") or query.get("expr") or []
                return values[0] if values else ""


            def grafana_explore_url(expr):
                pane = {
                    "datasource": GRAFANA_DATASOURCE_UID,
                    "queries": [
                        {
                            "refId": "A",
                            "datasource": {
                                "uid": GRAFANA_DATASOURCE_UID,
                                "type": "prometheus",
                            },
                            "expr": expr,
                            "range": True,
                        }
                    ],
                    "range": {
                        "from": GRAFANA_RANGE_FROM,
                        "to": GRAFANA_RANGE_TO,
                    },
                }
                panes = urllib.parse.quote(json.dumps({"default": pane}, separators=(",", ":")))
                return f"{GRAFANA_URL}/explore?panes={panes}&schemaVersion=1&orgId={GRAFANA_ORG_ID}"


            def click(alerts):
                if not alerts:
                    return f"{GRAFANA_URL}/alerting/list"
                first = alerts[0]
                explicit_url = annotation(first, "grafana_url")
                if explicit_url:
                    return explicit_url
                expr = prometheus_expr(first.get("generatorURL"))
                if expr:
                    return grafana_explore_url(expr)
                return annotation(first, "runbook_url") or f"{GRAFANA_URL}/alerting/list"


            def publish(payload):
                alerts = payload.get("alerts") or []
                body = {
                    "topic": NTFY_TOPIC,
                    "title": title(payload.get("status", "firing"), alerts),
                    "message": message(alerts),
                    "priority": priority(payload.get("status", "firing"), alerts),
                    "tags": tags(payload.get("status", "firing"), alerts),
                }
                click_url = click(alerts)
                if click_url:
                    body["click"] = click_url

                request = urllib.request.Request(
                    NTFY_URL,
                    data=json.dumps(body).encode("utf-8"),
                    headers={
                        "Authorization": f"Bearer {read_token()}",
                        "Content-Type": "application/json",
                    },
                    method="POST",
                )
                with urllib.request.urlopen(request, timeout=10) as response:
                    response.read()
                    return response.status


            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path == "/healthz":
                        self.send_response(200)
                        self.end_headers()
                        self.wfile.write(b"ok\n")
                        return
                    self.send_response(404)
                    self.end_headers()

                def do_POST(self):
                    if self.path != "/alertmanager":
                        self.send_response(404)
                        self.end_headers()
                        return

                    length = int(self.headers.get("Content-Length", "0"))
                    try:
                        payload = json.loads(self.rfile.read(length))
                        publish(payload)
                    except (json.JSONDecodeError, urllib.error.URLError, OSError) as error:
                        self.send_response(502)
                        self.end_headers()
                        self.wfile.write(str(error).encode("utf-8"))
                        return

                    self.send_response(204)
                    self.end_headers()

                def log_message(self, fmt, *args):
                    print("%s - %s" % (self.address_string(), fmt % args), flush=True)


            if __name__ == "__main__":
                ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: alertmanager-ntfy-adapter
          namespace: apps-kube-prometheus-stack
          labels:
            app.kubernetes.io/name: alertmanager-ntfy-adapter
            app.kubernetes.io/part-of: kube-prometheus-stack
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: alertmanager-ntfy-adapter
          template:
            metadata:
              labels:
                app.kubernetes.io/name: alertmanager-ntfy-adapter
                app.kubernetes.io/part-of: kube-prometheus-stack
            spec:
              automountServiceAccountToken: false
              containers:
                - name: adapter
                  image: python:3.13-alpine
                  imagePullPolicy: IfNotPresent
                  command:
                    - python
                    - /app/adapter.py
                  env:
                    - name: TZ
                      value: Asia/Novosibirsk
                    - name: NTFY_URL
                      value: http://ntfy.apps-ntfy.svc.cluster.local/
                    - name: NTFY_TOPIC
                      value: grafana
                    - name: NTFY_TOKEN_FILE
                      value: /etc/ntfy-token/token
                    - name: GRAFANA_URL
                      value: https://grafana.xinfra.ru
                    - name: GRAFANA_DATASOURCE_UID
                      value: prometheus
                    - name: GRAFANA_ORG_ID
                      value: "1"
                    - name: GRAFANA_RANGE_FROM
                      value: now-1h
                    - name: GRAFANA_RANGE_TO
                      value: now
                  ports:
                    - name: http
                      containerPort: 8080
                  readinessProbe:
                    httpGet:
                      path: /healthz
                      port: http
                    initialDelaySeconds: 2
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 30
                  resources:
                    requests:
                      cpu: 5m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    runAsUser: 1000
                    runAsGroup: 1000
                  volumeMounts:
                    - name: app
                      mountPath: /app
                      readOnly: true
                    - name: ntfy-token
                      mountPath: /etc/ntfy-token
                      readOnly: true
              volumes:
                - name: app
                  configMap:
                    name: alertmanager-ntfy-adapter
                - name: ntfy-token
                  secret:
                    secretName: alertmanager-ntfy-token
      - apiVersion: v1
        kind: Service
        metadata:
          name: alertmanager-ntfy-adapter
          namespace: apps-kube-prometheus-stack
          labels:
            app.kubernetes.io/name: alertmanager-ntfy-adapter
            app.kubernetes.io/part-of: kube-prometheus-stack
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: alertmanager-ntfy-adapter
          ports:
            - name: http
              port: 8080
              targetPort: http
