apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: twitch
  namespace: twitch-sub-bot
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: .helm
      sourceRef:
        kind: GitRepository
        name: twitch-sub-bot
        namespace: flux-system
      interval: 1h
  values:
    imagePullSecrets:
      - name: zot
    image:
      tag: "v0.2.14" # {"$imagepolicy": "flux-system:twitch-sub-bot:tag"}
