---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dozzle
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s/apps/dozzle
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  releaseName: dozzle
  targetNamespace: monitoring
