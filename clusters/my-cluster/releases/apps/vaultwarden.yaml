---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: security
spec:
  interval: 10m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vaultwarden
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
        namespace: flux-system
      interval: 1h
  values:
    image:
      registry: docker.io
      repository: vaultwarden/server
      tag: "1.36.0-alpine"
      pullPolicy: IfNotPresent

    replicas: 1

    serviceAccount:
      create: true
      name: "vaultwarden-svc"
      automountServiceAccountToken: false

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    startupProbe:
      enabled: true
      path: /alive
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 12

    readinessProbe:
      enabled: true
      path: /alive
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

    livenessProbe:
      enabled: true
      path: /alive
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6

    resources:
      requests:
        cpu: 20m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 256Mi

    storage:
      data:
        name: "vaultwarden-data"
        size: "15Gi"
        class: "longhorn"
        path: "/data"
        accessMode: "ReadWriteOnce"

    database:
      type: "postgresql"
      host: "lab-postgres-rw.database.svc.cluster.local"
      port: 5432
      dbName: "vaultwarden"
      username: "vaultwarden"
      existingSecret: "vaultwarden"
      existingSecretPasswordKey: "db-password"
      connectionRetries: 15
      maxConnections: 10

    domain: "https://warden.xinfra.ru"
    signupsAllowed: false
    signupsVerify: "true"
    invitationsAllowed: false
    showPassHint: "false"
    timeZone: "Asia/Novosibirsk"
    ipHeader: "X-Real-IP"
    iconService: "internal"

    adminToken:
      existingSecret: "vaultwarden"
      existingSecretKey: "admin-token"

    ingress:
      enabled: true
      class: "traefik"
      tls: true
      hostname: "warden.xinfra.ru"
      tlsSecret: "wildcard-xinfra-ru-tls"

    sso:
      enabled: true
      existingSecret: "vaultwarden"
      onlySSO: true
      enforceSSO: true
      signupsMatchEmail: true
      ignoreEmailVerification: false
      authority: "https://auth.xinfra.ru"
      scopes: "openid email profile offline_access"
      pkce: true
      clientId:
        existingSecretKey: "sso-client-id"
      clientSecret:
        existingSecretKey: "sso-client-secret"
