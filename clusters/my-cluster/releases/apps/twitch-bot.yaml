apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: twitch
  namespace: apps
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: .helm
      sourceRef:
        kind: GitRepository
        name: twitch-sub-bot
        namespace: flux-system
      interval: 1h
  values:
    imagePullSecrets:
      - name: zot-reader
    database:
      existingSecret: "twich-bot-db-creds"
    creds:
      existingSecret: "twitch-bot-creds"
    image:
      tag: "v0.4.1" # {"$imagepolicy": "flux-system:twitch-sub-bot:tag"}
    env:
      LIMITER_MAX_RATE: 100
