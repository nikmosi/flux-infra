---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: v1.12.0
  interval: 1m0s
  releaseName: longhorn
  targetNamespace: longhorn-system
  install:
    timeout: 20m0s
  upgrade:
    timeout: 20m0s
