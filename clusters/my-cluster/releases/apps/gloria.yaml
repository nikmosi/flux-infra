apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gloria
  namespace: apps
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: .helm
      sourceRef:
        kind: GitRepository
        name: gloria
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: zot.xinfra.ru/gloria
      tag: "0.1.2"
      pullPolicy: Always
    imagePullSecrets:
      - name: zot-reader
    collector:
      existingSecret: gloria-config
      logLevel: "INFO"
      persistence:
        size: 128Mi

    extraEnv:
      - name: GLORIA_DB_USER
        valueFrom:
          secretKeyRef:
            name: gloria-db-user
            key: username
      - name: GLORIA_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: gloria-db-user
            key: password
      - name: GLORIA_DATABASE
        value: "postgresql+asyncpg://$(GLORIA_DB_USER):$(GLORIA_DB_PASSWORD)@lab-postgres-rw.database.svc.cluster.local:5432/gloria"

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: gloria.xinfra.ru
          paths:
            - path: /login/confirm
              pathType: Prefix
            - path: /login
              pathType: Prefix
      tls:
        - secretName: wildcard-xinfra-ru-tls
          hosts:
            - gloria.xinfra.ru
