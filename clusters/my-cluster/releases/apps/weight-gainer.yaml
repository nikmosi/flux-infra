apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: twitch
  namespace: apps
spec:
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: .helm
      sourceRef:
        kind: GitRepository
        name: weight-gainer
        namespace: flux-system
      interval: 1h
  values:
    imagePullSecrets:
      - name: zot-reader
    image:
      tag: "0.1.0"  # {"$imagepolicy": "flux-system:weight-gainer:tag"}
