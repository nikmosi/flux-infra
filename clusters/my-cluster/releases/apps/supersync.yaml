---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supersync
  namespace: apps-supersync
spec:
  suspend: true
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "status"
          - "metadata.generation"
          - "metadata.managedFields"
          - "metadata.annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s/apps/supersync
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  releaseName: supersync
  targetNamespace: apps-supersync
  values:
    replicaCount: 1

    image:
      repository: iari/supersync
      pullPolicy: Always
      tag: "latest"

    ingress:
      enabled: true
      className: ""
      hosts:
        - host: sync.xinfra.ru
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: wildcard-xinfra-ru-tls
          hosts:
            - sync.xinfra.ru

    config:
      host: "0.0.0.0"
      publicUrl: "https://sync.xinfra.ru"
      corsEnabled: true
      webauthnRpId: sync.xinfra.ru
      webauthnOrigin: https://sync.xinfra.ru
      corsOrigins: "https://app.super-productivity.com,https://*.super-productivity-preview.pages.dev"
      webauthnRpName: "Super Productivity Sync"

    secret:
      jwtSecret: ""
      databaseUrl: ""
      smtpUser: ""
      smtpPass: ""
      existingSecret: "supersync-secret"

    persistence:
      enabled: true
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 1Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 768Mi

    extraEnv:
      - name: TZ
        value: "Asia/Novosibirsk"

    postgresql:
      enabled: true
      auth:
        username: supersync
        database: supersync
        existingSecret: "supersync-secret"
      primary:
        persistence:
          enabled: true
          storageClass: local-path
          size: 8Gi
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 1Gi
