---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supersync
  namespace: apps
spec:
  suspend: false
  dependsOn:
    - name: cnpg
      namespace: database
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: packages/super-sync-server/helm/supersync
      sourceRef:
        kind: GitRepository
        name: super-productivity
        namespace: flux-system
      interval: 1h
  values:
    replicaCount: 1

    image:
      repository: ghcr.io/super-productivity/supersync
      pullPolicy: Always
      tag: "latest"

    supersync:
      port: 1900
      host: "0.0.0.0"
      nodeEnv: production
      publicUrl: "https://sync.xinfra.ru"
      existingSecret: "supersync-secret"
      cors:
        origins: "https://app.super-productivity.com,https://*.super-productivity-preview.pages.dev"
      webauthn:
        rpName: "Super Productivity Sync"
        rpId: "sync.xinfra.ru"
        origin: "https://sync.xinfra.ru"
      persistence:
        enabled: true
        storageClass: "longhorn"
        accessModes:
          - ReadWriteOnce
        size: 5Gi

    postgresql:
      enabled: false

    externalDatabase:
      existingSecret: "supersync-secret"

    ingress:
      enabled: true
      className: "traefik"
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      hosts:
        - host: sync.xinfra.ru
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: wildcard-xinfra-ru-tls
          hosts:
            - sync.xinfra.ru

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
