---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-low
  resources:
    requests:
      storage: 100Gi
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-buffering
  namespace: apps
spec:
  buffering:
    maxRequestBodyBytes: 0
    memRequestBodyBytes: 2097152
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: apps
spec:
  interval: 10m
  dependsOn:
    - name: cnpg
      namespace: database
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: immich
      version: "0.13.4"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              DB_HOSTNAME: "immich-postgres-rw.database.svc.cluster.local"
              DB_PORT: "5432"
              DB_DATABASE_NAME: "immich"
              DB_USERNAME: "immich"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-user
                    key: password

    immich:
      persistence:
        library:
          existingClaim: immich-library

    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: emptyDir

    server:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      ingress:
        main:
          enabled: true
          className: "traefik"
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: apps-immich-buffering@kubernetescrd
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: immich.xinfra.ru
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: main
                    port: http
          tls:
            - secretName: wildcard-xinfra-ru-tls
              hosts:
                - immich.xinfra.ru

    machine-learning:
      enabled: true
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1500m
          memory: 2Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClass: longhorn-low
