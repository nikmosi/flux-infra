---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: security
spec:
  dependsOn:
    - name: lldap
      namespace: security
  interval: 5m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s/charts/authelia
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  values:
    enabled: true

    image:
      registry: ghcr.io
      repository: authelia/authelia
      pullPolicy: Always

    rbac:
      enabled: true
      serviceAccountName: authelia

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: true
      className: traefik
      rulesOverride:
        - host: auth.xinfra.ru
          path: /
      tls:
        enabled: true
        secret: wildcard-xinfra-ru-tls
      traefikCRD:
        enabled: true
        disableIngressRoute: true
        entryPoints:
          - websecure
        middlewares:
          auth:
            authResponseHeaders:
              - Remote-User
              - Remote-Name
              - Remote-Email
              - Remote-Groups

    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate
      env:
        - name: TZ
          value: Asia/Novosibirsk
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 2000
          runAsGroup: 2000
        pod:
          fsGroup: 2000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
      extraVolumes:
        - name: tmp
          emptyDir: {}

    persistence:
      enabled: true
      storageClass: longhorn
      existingClaim: authelia
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    secret:
      disabled: false
      additionalSecrets:
        authelia-ldap:
          items:
            - key: password
              path: password
        authelia-users-external:
          path: users
          items:
            - key: users_database.yml
              path: users_database.yml
        authelia-core:
          path: authelia-core
        authelia-reset-password:
          path: authelia-reset-password
        authelia-oidc:
          path: authelia-oidc

    configMap:
      theme: dark
      default_2fa_method: totp

      server:
        port: 9091
        path: ""
        headers:
          csp_template: ""
        buffers:
          read: 4096
          write: 4096
        timeouts:
          read: 6 seconds
          write: 6 seconds
          idle: 30 seconds
        endpoints:
          enable_pprof: false
          enable_expvars: false
          automatic_authz_implementations:
            - ForwardAuth
          authz: {}
          rate_limits:
            reset_password_start:
              enable: true
              buckets: []
            reset_password_finish:
              enable: true
              buckets: []
            second_factor_totp:
              enable: true
              buckets: []
            second_factor_duo:
              enable: true
              buckets: []
            session_elevation_start:
              enable: true
              buckets: []
            session_elevation_finish:
              enable: true
              buckets: []
            openid_connect_token:
              enable: true
              buckets: []
            openid_connect_pushed_authorization_request:
              enable: true
              buckets: []

      log:
        level: info
        format: text

      telemetry:
        metrics:
          enabled: true
          port: 9959
          serviceMonitor:
            enabled: true

      identity_validation:
        reset_password:
          jwt_lifespan: 5 minutes
          jwt_algorithm: HS256
          secret:
            secret_name: authelia-reset-password
            path: identity_validation.reset_password.jwt.hmac.key
        elevated_session:
          code_lifespan: 5 minutes
          elevation_lifespan: 10 minutes
          characters: 8
          require_second_factor: true
          skip_second_factor: false

      totp:
        issuer: XInfra
        algorithm: SHA1
        digits: 6
        period: 30
        skew: 1

      webauthn:
        disable: false
        enable_passkey_login: false
        display_name: XInfra
        attestation_conveyance_preference: indirect
        timeout: 60 seconds
        selection_criteria:
          attachment: ""
          discoverability: preferred
          user_verification: preferred
        filtering:
          permitted_aaguids: []
          prohibited_aaguids: []
          prohibit_backup_eligibility: false
        metadata:
          enabled: false
          cache_policy: strict
          validate_trust_anchor: true
          validate_entry: true
          validate_entry_permit_zero_aaguid: false
          validate_status: true
          validate_status_permitted: []
          validate_status_prohibited: []

      ntp:
        address: udp://time.cloudflare.com:123
        version: 4
        max_desync: 3 seconds
        disable_startup_check: false
        disable_failure: false

      authentication_backend:
        password_reset:
          disable: false
        password_change:
          disable: false
        refresh_interval: 5 minutes
        ldap:
          enabled: true
          implementation: lldap
          address: ldap://lldap.security.svc.cluster.local:3890
          timeout: 5 seconds
          start_tls: false
          pooling:
            enable: false
            count: 5
            retries: 2
            timeout: 10 seconds
          base_dn: dc=xinfra,dc=ru
          user: uid=authelia,ou=people,dc=xinfra,dc=ru
          password:
            secret_name: authelia-ldap
            path: password
        file:
          enabled: false
          path: /secrets/users/users_database.yml
          watch: true
          search:
            email: true
            case_insensitive: true
          password:
            algorithm: sha2crypt
            sha2crypt:
              variant: sha512
              iterations: 50000
              salt_length: 16

      password_policy:
        standard:
          enabled: true
          min_length: 12
          require_uppercase: true
          require_lowercase: true
          require_number: true
          require_special: false
        zxcvbn:
          enabled: false
          min_score: 3

      access_control:
        default_policy: deny
        rules:
          - domain:
              - auth.xinfra.ru
            policy: bypass
          - domain:
              - dozzle.xinfra.ru
              - goldilocks.xinfra.ru
              - ntfy.xinfra.ru
            policy: one_factor
          - domain:
              - longhorn.xinfra.ru
            policy: two_factor
          - domain:
              - pgadmin.xinfra.ru
            policy: one_factor
          - domain:
              - "*.xinfra.ru"
            policy: two_factor

      session:
        name: authelia_session
        same_site: lax
        expiration: 1 hour
        inactivity: 10 minutes
        remember_me: 1 month
        encryption_key:
          secret_name: authelia-core
          path: session.encryption.key
        cookies:
          - domain: xinfra.ru
            subdomain: auth
            same_site: lax
            expiration: 1 hour
            inactivity: 10 minutes
        redis:
          enabled: false

      regulation:
        modes:
          - user
        max_retries: 3
        find_time: 2 minutes
        ban_time: 5 minutes

      storage:
        encryption_key:
          secret_name: authelia-core
          path: storage.encryption.key
        local:
          enabled: true
          path: /config/db.sqlite3
        mysql:
          enabled: false
        postgres:
          enabled: false

      notifier:
        disable_startup_check: true
        filesystem:
          enabled: true
          filename: /config/notification.txt
        smtp:
          enabled: false

      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            secret_name: authelia-core
            path: identity_providers.oidc.hmac.key
          lifespans:
            access_token: 1 hour
            refresh_token: 8 hours
            id_token: 1 hour
            authorize_code: 1 minute
            device_code: 10 minutes
            custom: {}
          enforce_pkce: public_clients_only
          enable_pkce_plain_challenge: false
          enable_jwt_access_token_stateless_introspection: false
          discovery_signed_response_alg: ""
          discovery_signed_response_key_id: ""
          require_pushed_authorization_requests: false
          minimum_parameter_entropy: 8
          enable_client_debug_messages: false
          pushed_authorizations:
            enforce: false
            context_lifespan: 5 minutes
          authorization_policies: {}
          claims_policies:
            default:
              id_token:
                - email
                - email_verified
                - alt_emails
                - preferred_username
                - name
                - groups
              access_token:
                - groups
            grafana:
              id_token:
                - email
                - email_verified
                - preferred_username
                - name
                - groups
                - entitlements
              access_token:
                - groups
                - entitlements
              custom_claims:
                entitlements:
                  attribute: groups
          scopes:
            entitlements:
              claims:
                - entitlements
          jwks:
            - key_id: authelia-rs256-2026-06
              algorithm: RS256
              use: sig
              key:
                path: /secrets/authelia-oidc/jwks.authelia-rs256-2026-06.pem
          cors:
            endpoints: []
            allowed_origins: []
            allowed_origins_from_client_redirect_uris: false
          clients:
            - client_id: grafana
              client_name: Grafana
              client_secret:
                path: /secrets/authelia-oidc/grafana-client-secret
              public: false
              authorization_policy: two_factor
              consent_mode: implicit
              claims_policy: grafana
              redirect_uris:
                - https://grafana.xinfra.ru/login/generic_oauth
              scopes:
                - openid
                - profile
                - email
                - groups
                - entitlements
                - offline_access
              response_types:
                - code
              grant_types:
                - authorization_code
                - refresh_token
              require_pkce: true
              pkce_challenge_method: S256
              token_endpoint_auth_method: client_secret_post

            - client_id: forgejo
              client_name: Forgejo
              client_secret:
                path: /secrets/authelia-oidc/forgejo-client-secret
              public: false
              authorization_policy: two_factor
              consent_mode: implicit
              claims_policy: default
              redirect_uris:
                - https://git.xinfra.ru/user/oauth2/authelia/callback
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              response_types:
                - code
              grant_types:
                - authorization_code
                - refresh_token
              require_pkce: false
              token_endpoint_auth_method: client_secret_basic

            - client_id: 9GaHg9eweQN8edJ1J4Ox205V5EkktTM907jGjzrb
              client_name: Vikunja
              client_secret:
                path: /secrets/authelia-oidc/vikunja-client-secret
              public: false
              authorization_policy: two_factor
              consent_mode: implicit
              claims_policy: default
              redirect_uris:
                - https://vikunja.xinfra.ru/auth/openid/authelia
                - https://vikunja.xinfra.ru/auth/openid/authentik
              scopes:
                - openid
                - profile
                - email
                - groups
              response_types:
                - code
              grant_types:
                - authorization_code
              require_pkce: false
              token_endpoint_auth_method: client_secret_basic

            - client_id: GF5EXFDkYc1wzKOVEZXI4LHAOevsPz7J7g1ag95Y
              client_name: Vaultwarden
              client_secret:
                path: /secrets/authelia-oidc/vaultwarden-client-secret
              public: false
              authorization_policy: two_factor
              claims_policy: default
              redirect_uris:
                - https://warden.xinfra.ru/identity/connect/oidc-signin
                - https://warden.xinfra.ru/sso-connector.html
              scopes:
                - openid
                - profile
                - email
                - offline_access
              response_types:
                - code
              grant_types:
                - authorization_code
                - refresh_token
              require_pkce: true
              pkce_challenge_method: S256
              token_endpoint_auth_method: client_secret_basic

            - client_id: PKNtTDqi5REDQYuUiIMScLAtQNnCeDTMglxhU04I
              client_name: zot
              client_secret:
                path: /secrets/authelia-oidc/zot-client-secret
              public: false
              authorization_policy: two_factor
              consent_mode: implicit
              claims_policy: default
              redirect_uris:
                - https://zot.xinfra.ru/zot/auth/callback/oidc
              scopes:
                - openid
                - profile
                - email
                - groups
              response_types:
                - code
              grant_types:
                - authorization_code
              require_pkce: false
              token_endpoint_auth_method: client_secret_basic

            - client_id: zipline
              client_name: Zipline
              client_secret:
                path: /secrets/authelia-oidc/zipline-client-secret
              public: false
              authorization_policy: two_factor
              consent_mode: implicit
              claims_policy: default
              redirect_uris:
                - https://zipline.xinfra.ru/api/auth/oauth/oidc
              scopes:
                - openid
                - profile
                - email
                - offline_access
              response_types:
                - code
              grant_types:
                - authorization_code
                - refresh_token
              require_pkce: false
              access_token_signed_response_alg: none
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_post
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: security
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.xinfra.ru`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: chain-authelia
          namespace: security
      priority: 500
      services:
        - kind: Service
          name: authelia
          namespace: security
          passHostHeader: true
          port: 80
          responseForwarding:
            flushInterval: 100ms
          scheme: http
          strategy: RoundRobin
          weight: 10
  tls:
    options:
      name: authelia
      namespace: security
    secretName: wildcard-xinfra-ru-tls
