---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: database
spec:
  interval: 10m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - "/status"
          - "/metadata/generation"
          - "/metadata/managedFields"
          - "/metadata/annotations"
        target:
          kind: ".*"
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  values:
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
    resources:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 100m
        memory: 100Mi

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab-postgres
  namespace: database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  primaryUpdateStrategy: unsupervised

  storage:
    storageClass: longhorn-low
    size: 10Gi

  walStorage:
    storageClass: longhorn-low
    size: 10Gi

  bootstrap:
    initdb:
      database: app_db
      owner: app_user

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"

  monitoring:
    enablePodMonitor: true

  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://a353ae34-e55f-4d81-b4fd-902fffed4427/lab-postgres-cnpg
      endpointURL: https://s3.twcstorage.ru
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-backup-creds
          key: SECRET_ACCESS_KEY
        region:
          name: cnpg-s3-backup-creds
          key: REGION
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lab-postgres-backup
  namespace: database
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: lab-postgres
