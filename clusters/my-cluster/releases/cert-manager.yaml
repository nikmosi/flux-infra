---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: cert-manager
  chart:
    spec:
      chart: k8s/charts/cert-manager
      sourceRef:
        kind: GitRepository
        name: apps-charts
        namespace: flux-system
      interval: 1h
  targetNamespace: cert-manager
  values:
    crds:
      enabled: true

    extraEnv:
      - name: TZ
        value: Asia/Novosibirsk
      - name: GODEBUG
        value: http2client=0

    cainjector:
      extraEnv:
        - name: TZ
          value: Asia/Novosibirsk

    webhook:
      extraEnv:
        - name: TZ
          value: Asia/Novosibirsk
