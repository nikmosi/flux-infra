---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: homebox-mcp
  namespace: flux-system
spec:
  image: zot.xinfra.ru/homebox-mcp
  interval: 2m
  secretRef:
    name: zot-reader
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: homebox-mcp
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: homebox-mcp
  filterTags:
    pattern: "^v(?P<semver>.*)"
  policy:
    semver:
      range: ">=0.1.0 <1.0.0"
