---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: twitch-sub-bot
  namespace: flux-system
spec:
  image: zot.xinfra.ru/twitch-sub-check
  interval: 5m
  secretRef:
    name: zot
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: twitch-sub-bot
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: twitch-sub-bot
  filterTags:
    pattern: "^v(?P<semver>.*)"
  policy:
    semver:
      range: ">=0.2.0 <1.0.0"
