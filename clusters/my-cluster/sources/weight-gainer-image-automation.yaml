---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: weight-gainer
  namespace: flux-system
spec:
  image: zot.xinfra.ru/weight-gainer
  interval: 5m
  secretRef:
    name: zot
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: weight-gainer
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: weight-gainer
  filterTags:
    pattern: "^(?P<semver>.*)"
  policy:
    semver:
      range: ">=0.1.0 <1.0.0"
