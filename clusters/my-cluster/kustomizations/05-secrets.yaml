---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m0s
  path: ./clusters/my-cluster/secrets
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
  driftDetection:
    mode: enabled
  ignore:
    - paths:
        - "status"
        - "metadata.generation"
        - "metadata.managedFields"
        - "metadata.annotations"
      target:
        kind: ".*"
  decryption:
    provider: sops
    secretRef:
      name: sops-age
