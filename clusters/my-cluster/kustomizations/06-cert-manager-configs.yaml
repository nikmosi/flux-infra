---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: releases
    - name: secrets
  interval: 10m0s
  path: ./clusters/my-cluster/infrastructure/cert-manager
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
