---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-configs
  interval: 10m0s
  path: ./clusters/my-cluster/releases/apps
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
  driftDetection:
    mode: enabled
  remediation:
    remediate: true
  ignore:
    - paths:
        - "status"
        - "metadata.generation"
        - "metadata.managedFields"
        - "metadata.annotations"
      target:
        kind: "*"
  decryption:
    provider: sops
    secretRef:
      name: sops-age
