---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/my-cluster/sources
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
  ignore:
    - paths:
        - "/metadata/annotations"
        - "/status"
      target:
        kind: ".*"
  decryption:
    provider: sops
    secretRef:
      name: sops-age
